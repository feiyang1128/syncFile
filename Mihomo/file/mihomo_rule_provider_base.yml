    behavior: classical
    format: yaml
    url: https://gh-proxy.org/https://raw.githubusercontent.com/feiyang1128/syncFile/refs/heads/main/Mihomo/file/yaml/cloudflare-extra.yaml
    path: ./feiyang/cloudflare-extra.yaml
    interval: 21600
  direct:
