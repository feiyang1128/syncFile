[custom]
;不要随意改变关键字，否则会导致出错
;由原 Mihomo/Clash 配置转换
;
;说明：
;1. 本配置用于 subconverter/订阅转换
;2. Reject / AI / Cloudflare 上游规则使用 file/list 下的远程列表
;3. 固定 rules 按原始顺序拆分为 file/list/rules-*.list，避免后端内联解析回退
;4. ruleset 引用顺序严格按照原 YAML rules 顺序生成，避免改变匹配优先级
;5. IPV6 组使用所有节点测速 IPv6 地址，尽量贴近原 include-all 行为
;6. traditional custom_proxy_group 无法完全 1:1 还原 Mihomo 的 include-all / exclude-filter / lazy / strategy

;==================================================
; 规则（保持原 YAML 顺序）
;==================================================
ruleset=🌍 cloudflare,https://raw.githubusercontent.com/feiyang1128/syncFile/refs/heads/main/Mihomo/file/list/rules-001-cloudflare.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/feiyang1128/syncFile/refs/heads/main/Mihomo/file/list/rules-002-direct.list
ruleset=🛑 全球拦截,https://raw.githubusercontent.com/feiyang1128/syncFile/refs/heads/main/Mihomo/file/list/rules-003-reject.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/feiyang1128/syncFile/refs/heads/main/Mihomo/file/list/rules-004-direct.list
ruleset=🛑 全球拦截,https://raw.githubusercontent.com/feiyang1128/syncFile/refs/heads/main/Mihomo/file/list/reject.list
ruleset=✨ AI,https://raw.githubusercontent.com/feiyang1128/syncFile/refs/heads/main/Mihomo/file/list/AI.list
ruleset=🌍 cloudflare,https://raw.githubusercontent.com/feiyang1128/syncFile/refs/heads/main/Mihomo/file/list/cloudflareip.list
ruleset=🌍 cloudflare,https://raw.githubusercontent.com/feiyang1128/syncFile/refs/heads/main/Mihomo/file/list/rules-005-cloudflare.list
ruleset=🌐 IPV6,https://raw.githubusercontent.com/feiyang1128/syncFile/refs/heads/main/Mihomo/file/list/rules-006-ipv6.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/feiyang1128/syncFile/refs/heads/main/Mihomo/file/list/rules-007-proxy.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/feiyang1128/syncFile/refs/heads/main/Mihomo/file/list/rules-008-direct.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/feiyang1128/syncFile/refs/heads/main/Mihomo/file/list/rules-009-proxy.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/feiyang1128/syncFile/refs/heads/main/Mihomo/file/list/rules-010-direct.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/feiyang1128/syncFile/refs/heads/main/Mihomo/file/list/rules-011-proxy.list
ruleset=🛑 全球拦截,https://raw.githubusercontent.com/feiyang1128/syncFile/refs/heads/main/Mihomo/file/list/rules-012-reject.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/feiyang1128/syncFile/refs/heads/main/Mihomo/file/list/rules-013-proxy.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/feiyang1128/syncFile/refs/heads/main/Mihomo/file/list/rules-014-direct.list
ruleset=🎯 全球直连,[]GEOIP,CN
ruleset=🐟 漏网之鱼,[]FINAL

;==================================================
; 代理组（后端兼容版）
;==================================================

custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]🌐 IPV6`[]DIRECT`[]🔮 负载-轮询`[]🔮 负载-散列`[]🔯 故障转移`^(?!.*(v6|V6|ipv6|IPV6)).*$

custom_proxy_group=♻️ 自动选择`url-test`^(?!.*(v6|V6|ipv6|IPV6)).*$`http://www.gstatic.com/generate_204`300,,50

custom_proxy_group=🌐 IPV6`url-test`(v6|V6|ipv6|IPV6)`http://www.gstatic.com/generate_204`300,,50

custom_proxy_group=✨ AI`url-test`^(?!.*(v6|V6|ipv6|IPV6|香港|HK|台湾|TW|澳门|MO|🇭🇰|🇹🇼|🇲🇴|🇨🇳)).*$`http://www.gstatic.com/generate_204`300,,50

custom_proxy_group=🌍 cloudflare`url-test`^(?!.*(v6|V6|ipv6|IPV6|cf|CF|cloudflare|Cloudflare|CLOUDFLARE)).*$`http://www.gstatic.com/generate_204`300,,50

custom_proxy_group=🔮 负载-轮询`load-balance`^(?!.*(v6|V6|ipv6|IPV6)).*$`http://www.gstatic.com/generate_204`300

custom_proxy_group=🔮 负载-散列`load-balance`^(?!.*(v6|V6|ipv6|IPV6)).*$`http://www.gstatic.com/generate_204`300

custom_proxy_group=🔯 故障转移`fallback`^(?!.*(v6|V6|ipv6|IPV6)).*$`http://www.gstatic.com/generate_204`300

custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择`[]♻️ 自动选择

custom_proxy_group=🛑 全球拦截`select`[]REJECT`[]DIRECT

custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]🎯 全球直连`[]♻️ 自动选择`.*
;==================================================
; 规则生成
;==================================================

enable_rule_generator=true
overwrite_original_rules=true
