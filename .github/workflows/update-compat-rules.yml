name: Update Mihomo rules

on:
  workflow_dispatch:
  schedule:
    - cron: "20 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Convert payload rules
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import urllib.request

          base = Path("Mihomo/file")
          yaml_dir = base / "yaml"
          yaml_dir.mkdir(parents=True, exist_ok=True)

          sources = {
              yaml_dir / "unban.yaml": "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list",
          }

          ad_sources = [
              "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list",
              "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list",
              "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanEasyList.list",
              "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanEasyListChina.list",
              "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanEasyPrivacy.list",
          ]

          typed_prefixes = (
              "DOMAIN,",
              "DOMAIN-SUFFIX,",
              "DOMAIN-KEYWORD,",
              "DOMAIN-REGEX,",
              "IP-CIDR,",
              "IP-CIDR6,",
              "SRC-IP-CIDR,",
              "GEOIP,",
              "PROCESS-NAME,",
              "PROCESS-PATH,",
              "DST-PORT,",
          )

          ipv4_cidr = re.compile(r"^\d{1,3}(?:\.\d{1,3}){3}/\d+$")
          ipv6_cidr = re.compile(r"^[0-9a-fA-F:]+/\d+$")
          domain_like = re.compile(r"^[A-Za-z0-9_.-]+\.[A-Za-z]{2,}$")

          def read_source(src):
              if isinstance(src, Path):
                  return src.read_text(encoding="utf-8")
              with urllib.request.urlopen(src, timeout=60) as resp:
                  return resp.read().decode("utf-8")

          def normalize_item(item):
              item = item.strip()
              if (item.startswith("'") and item.endswith("'")) or (item.startswith('"') and item.endswith('"')):
                  item = item[1:-1]

              if item.startswith("+."):
                  return "DOMAIN-SUFFIX," + item[2:]
              if item.startswith("."):
                  return "DOMAIN-SUFFIX," + item[1:]
              if item.startswith(typed_prefixes):
                  return item
              if ipv4_cidr.match(item):
                  return "IP-CIDR," + item + ",no-resolve"
              if ipv6_cidr.match(item) and ":" in item:
                  return "IP-CIDR6," + item + ",no-resolve"
              if domain_like.match(item):
                  return "DOMAIN-SUFFIX," + item
              return item

          def convert(text):
              out = []
              for raw in text.splitlines():
                  line = raw.strip()
                  if not line or line == "payload:":
                      continue
                  if line.startswith("#"):
                      continue
                  if line.startswith("- "):
                      line = line[2:]
                  out.append(normalize_item(line))
              return to_yaml_payload(out)

          def to_yaml_payload(rules):
              lines = ["payload:"]
              for rule in rules:
                  lines.append("  - '" + rule.replace("'", "''") + "'")
              return "\n".join(lines).rstrip() + "\n"

          for dst, src in sources.items():
              dst.write_text(convert(read_source(src)), encoding="utf-8")

          ad_rules = {}
          for src in ad_sources:
              for raw in read_source(src).splitlines():
                  line = raw.strip()
                  if not line or line.startswith("#"):
                      continue
                  ad_rules.setdefault(line, None)

          (yaml_dir / "reject-ad.yaml").write_text(
              to_yaml_payload(ad_rules.keys()),
              encoding="utf-8",
          )

          print("lists updated")
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Mihomo/file/yaml/unban.yaml Mihomo/file/yaml/reject-ad.yaml
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update mihomo rules"
            git push
          fi
